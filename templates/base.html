<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>{% block title %}TV Tracker{% endblock %}</title>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>📺 TV Tracker</h1>
            <nav>
                <a href="{{ url_for('index') }}">My Shows</a>
                <a href="{{ url_for('add_show') }}" class="btn">+ Add Show</a>
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
